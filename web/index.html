<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d0e" />
  <script>try{var t=localStorage.getItem("theme");t=t==="light"||t==="system"?t:"dark";document.documentElement.dataset.theme=t;if(t==="light"||(t==="system"&&matchMedia("(prefers-color-scheme: light)").matches))document.querySelector('meta[name=theme-color]').content="#f4f6f5"}catch(e){document.documentElement.dataset.theme="dark"}</script>
  <title>Macro Snap</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main id="view"></main>

  <button class="fab" id="logFab" aria-label="Log a meal"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Log</button>

  <nav class="tabs" id="tabs" aria-label="Main">
    <a href="#/today" data-tab="today"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8"/><circle cx="12" cy="12" r="3"/></svg><span>Today</span></a>
    <a href="#/foods" data-tab="foods"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4v16H5zM10 4h4v16h-4zM15.5 5l3.5-1 2 15.5-3.5 1z"/></svg><span>Library</span></a>
    <a href="#/trends" data-tab="trends"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M6 15l4-5 3 3 5-7"/></svg><span>Trends</span></a>
    <a href="#/settings" data-tab="settings"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Settings</span></a>
    <a href="#/account" data-tab="account" id="tabAccount" hidden><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.5 4-5 7-5s5.8 1.5 7 5"/></svg><span>Account</span></a>
  </nav>

  <dialog id="sheet" class="sheet"><div id="sheetBody"></div></dialog>
  <dialog id="modal" class="sheet"><div id="modalBody"></div></dialog>
  <input type="file" accept="image/*" id="photoInput" hidden />
  <input type="file" accept="image/*" capture="environment" id="shootInput" hidden />
  <div class="toast" id="toast"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
